[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mf-faq"
version = "1.0.0"
description = "HSBC Mutual Fund facts-only FAQ assistant — ingestion and refresh"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]
index = [
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]
