name: Daily Corpus Refresh

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[embed,index]"

      - name: Run corpus refresh
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m mf_faq.ingestion.refresh

      - name: Commit refresh artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/refresh/content_hashes.json data/index/manifest.json
          git diff --cached --quiet || git commit -m "chore: daily corpus refresh $(date -u +%Y-%m-%d)"
          git push
